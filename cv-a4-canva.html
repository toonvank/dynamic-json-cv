        margin-bottom: 6px;

        content: "•";
        position: absolute;
        left: 0;
        top: 0;
      }

        color: var(--text-dark);
        background-color: var(--white);
      }

        font-size: 32px;
        font-weight: 700;
        color: var(--primary-text);
        margin-bottom: 5px;
        text-transform: uppercase;
      }

        font-weight: 300;
      }

        font-size: 16px;
        font-weight: 400;
        color: var(--text-light);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 20px;
      }

      .template-canva .divider {
        height: 3px;
        background-color: var(--primary-text);
        width: 100%;
        margin-bottom: 25px;
      }

        font-weight: 700;
        color: var(--primary-text);

        letter-spacing: 1px;

        margin-top: 25px;

        line-height: 1.6;
        color: var(--text-light);

    <!-- Rendering Logic -->
    <script>
      let currentLang = localStorage.getItem('cv-lang') || 'nl';
      let currentTemplate = localStorage.getItem('cv-template') || 'canva';
      let currentContent = localStorage.getItem('cv-content-key') || 'default';
      let contentTemplates = {};
      let data = {};

      function discoverContentTemplates() {
        contentTemplates = {};
        const scripts = document.querySelectorAll('script[type="application/json"]');
        scripts.forEach(script => {
          const label = script.getAttribute('data-cv-content');
          if (label) {
            const key = script.id || label.toLowerCase().replace(/\s+/g, '-');
            try {
              contentTemplates[key] = JSON.parse(script.textContent);
              contentTemplates[key]._label = label;
            } catch (e) {
              console.error(`Error parsing content ${key}:`, e);
            }
          } else if (script.id === 'cv-data') {
            // Support legacy ID for the default content
            try {
              contentTemplates['default'] = JSON.parse(script.textContent);
              contentTemplates['default']._label = 'Default';
            } catch (e) {
              console.error("Error parsing default content:", e);
            }
          }
        });

        // Ensure we have at least one content set
        if (Object.keys(contentTemplates).length === 0) {
           contentTemplates['default'] = { basics: { name: "No Data Found" }, experience: [], education: [], skills: { languages: [] } };
           contentTemplates['default']._label = 'No Data';
        }
        
        // Ensure currentContent is valid
        if (!contentTemplates[currentContent]) {
          currentContent = Object.keys(contentTemplates)[0];
        }
      }

      function setContent(key) {
        if (!contentTemplates[key]) return;
        currentContent = key;
        localStorage.setItem('cv-content-key', key);
        data = contentTemplates[key];
        render();
        updateUI();
      }

      function getText(obj) {
        if (!obj) return '';
        if (typeof obj === 'string') return obj;
        return obj[currentLang] || obj['en'] || obj['nl'] || '';
      }

      function formatDates(start, end) {
        const startStr = start ? start.toUpperCase() : '';
        let endStr = end ? end.toUpperCase() : (currentLang === 'nl' ? 'HEDEN' : 'PRESENT');
        if (startStr === endStr) return startStr;
        return `${startStr} — ${endStr}`;
      }

      function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('cv-lang', lang);
        render();
        updateUI();
      }

      function setTemplate(tpl) {
        currentTemplate = tpl;
        localStorage.setItem('cv-template', tpl);
        loadFonts(tpl);
        render();
        updateUI();
      }

      function loadFonts(tpl) {
        const fontMap = {
          'canva': 'Inter:wght@300;400;600;700',
          'modern': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'classic': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'executive': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400',
          'developer': 'Poppins:wght@300;400;600;700;800',
          'minimalist': 'Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'timeline': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'editorial': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'hacker': 'Fira+Code:wght@400;600;700',
          'swiss': 'Poppins:wght@300;400;600;700;800',
          'slate': 'Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,700;1,700',
          'maven': 'Montserrat:wght@400;600;700;800&family=Crimson+Pro:ital,wght@0,400;1,400',
          'apex': 'Outfit:wght@300;400;600;700;800&family=IBM+Plex+Mono:wght@400;500'
        };

        const families = fontMap[tpl] || fontMap['canva'];
        const url = `https://fonts.googleapis.com/css2?family=${families}&display=swap`;
        document.getElementById('dynamic-fonts').href = url;
      }

      function updateUI() {
        // Update language buttons
        document.getElementById('btn-nl').className = currentLang === 'nl' ? 'px-3 py-1 rounded bg-brand text-white font-bold text-[9pt]' : 'px-3 py-1 rounded bg-neutral-200 hover:bg-neutral-300 text-[9pt]';
        document.getElementById('btn-en').className = currentLang === 'en' ? 'px-3 py-1 rounded bg-brand text-white font-bold text-[9pt]' : 'px-3 py-1 rounded bg-neutral-200 hover:bg-neutral-300 text-[9pt]';

        // Update content selector
        const selector = document.getElementById('content-selector');
        if (selector) {
          if (selector.options.length === 0) {
            Object.keys(contentTemplates).forEach(key => {
              const opt = document.createElement('option');
              opt.value = key;
              opt.textContent = contentTemplates[key]._label || key;
              selector.appendChild(opt);
            });
          }
          selector.value = currentContent;
        }

        // Update template buttons
        const templates = ['canva', 'modern', 'classic', 'executive', 'developer', 'minimalist', 'timeline', 'editorial', 'hacker', 'swiss', 'slate', 'maven', 'apex'];
        templates.forEach(t => {

      }

          localStorage.setItem('cv-photo-url', url);

      function render() {

                            <span class="font-mono text-[7pt] font-bold text-neutral-300">${formatDates(exp.startDate, exp.endDate)}</span>
                          </div>
                          <div class="text-[9pt] font-bold text-brand uppercase mb-3 tracking-tighter">${getText(exp.position)}</div>
                          <p class="leading-tight text-neutral-500 font-medium">
                            ${getText(exp.description)}
                          </p>
                        </article>
                      `).join('')}
                    </div>
                  </section>
                </div>

                <div class="col-span-3 space-y-8">
                  <section class="avoid-break">
                    <div class="font-black uppercase tracking-[0.3em] text-neutral-300 text-[7pt] mb-4">${currentLang === 'nl' ? 'Vaardigheden' : 'Competencies'}</div>
                    <div class="flex flex-col gap-1.5">
                      ${data.skills.programming_languages.map(s => `
                        <div class="flex items-center gap-2 group">
                          <div class="w-1 h-3 bg-neutral-100 group-hover:bg-brand transition-colors"></div>
                          <span class="font-bold text-neutral-600 uppercase text-[7.5pt] tracking-tight">${s}</span>
                        </div>
                      `).join('')}
                      ${data.skills.frameworks.map(s => `
                        <div class="flex items-center gap-2 group">
                          <div class="w-1 h-3 bg-neutral-100 group-hover:bg-brand transition-colors"></div>
                          <span class="font-bold text-neutral-600 uppercase text-[7.5pt] tracking-tight">${s}</span>
                        </div>
                      `).join('')}
                      ${data.skills.tools.map(s => `
                        <div class="flex items-center gap-2 group">
                          <div class="w-1 h-3 bg-neutral-100 group-hover:bg-brand transition-colors"></div>
                          <span class="font-bold text-neutral-600 uppercase text-[7.5pt] tracking-tight">${s}</span>
                        </div>
                      `).join('')}
                    </div>
                  </section>

                  <section class="avoid-break">
                    <div class="font-black uppercase tracking-[0.3em] text-neutral-300 text-[7pt] mb-4">Education</div>
                    <div class="space-y-5">
                      ${data.education.map(edu => `
                        <div>
                          <div class="font-black text-neutral-900 uppercase leading-tight text-[8pt]">${edu.institution}</div>
                          <div class="text-neutral-400 font-medium mt-1 text-[7.5pt]">${getText(edu.area)}</div>
                          <div class="font-mono text-[7pt] text-neutral-300 mt-1 uppercase font-bold">${edu.startDate}</div>
                        </div>
                      `).join('')}
                    </div>
                  </section>

                  <div class="mt-auto pt-10">
                    <div class="text-[14pt] font-black opacity-10 uppercase tracking-[0.2em] text-neutral-900">
                      Professional<br>Record
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // Initial load
      document.addEventListener('DOMContentLoaded', () => {
        discoverContentTemplates();
        data = contentTemplates[currentContent];
        loadFonts(currentTemplate);
        render();
        updateUI();
      });
    </script>
  </body>
</html>
