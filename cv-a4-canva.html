        text-transform: uppercase;

        font-weight: 700;

    <!-- Rendering Logic -->
    <script>
      let currentLang = localStorage.getItem('cv-lang') || 'nl';
      let currentTemplate = localStorage.getItem('cv-template') || 'canva';
      let data = {};

      function getText(obj) {
        if (!obj) return '';
        if (typeof obj === 'string') return obj;
        return obj[currentLang] || obj['en'] || obj['nl'] || '';
      }

      function formatDates(start, end) {
        const startStr = start ? start.toUpperCase() : '';
        let endStr = end ? end.toUpperCase() : (currentLang === 'nl' ? 'HEDEN' : 'PRESENT');
        if (startStr === endStr) return startStr;
        return `${startStr} — ${endStr}`;
      }

      function setLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('cv-lang', lang);
        render();
        updateUI();
      }

      function setTemplate(tpl) {
        currentTemplate = tpl;
        localStorage.setItem('cv-template', tpl);
        loadFonts(tpl);
        render();
        updateUI();
      }

      function loadFonts(tpl) {
        const fontMap = {
          'canva': 'Inter:wght@300;400;600;700',
          'modern': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'classic': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'executive': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400',
          'developer': 'Poppins:wght@300;400;600;700;800',
          'minimalist': 'Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'timeline': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'editorial': 'Montserrat:wght@600;700;800&family=Lato:ital,wght@0,400;0,700;1,400;1,700',
          'hacker': 'Fira+Code:wght@400;600;700',
          'swiss': 'Poppins:wght@300;400;600;700;800',
          'academic': 'Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400',
          'architect': 'Oswald:wght@400;600;700',
          'newspaper': 'EB+Garamond:ital,wght@0,400;0,500;0,700;0,800;1,400',
          'brutalist': 'Space+Grotesk:wght@300;400;500;600;700',
          'boutique': 'Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400'
        };

        const families = fontMap[tpl] || fontMap['canva'];
        const url = `https://fonts.googleapis.com/css2?family=${families}&display=swap`;
        document.getElementById('dynamic-fonts').href = url;
      }

      function updateUI() {
        // Update language buttons
        document.getElementById('btn-nl').className = currentLang === 'nl' ? 'px-3 py-1 rounded bg-brand text-white font-bold text-[9pt]' : 'px-3 py-1 rounded bg-neutral-200 hover:bg-neutral-300 text-[9pt]';
        document.getElementById('btn-en').className = currentLang === 'en' ? 'px-3 py-1 rounded bg-brand text-white font-bold text-[9pt]' : 'px-3 py-1 rounded bg-neutral-200 hover:bg-neutral-300 text-[9pt]';

        // Update template buttons
        const templates = ['canva', 'modern', 'classic', 'executive', 'developer', 'minimalist', 'timeline', 'editorial', 'hacker', 'swiss', 'academic', 'architect', 'newspaper', 'brutalist', 'boutique'];
        templates.forEach(t => {
          const btn = document.getElementById(`btn-tpl-${t}`);
          if (btn) {
            btn.className = currentTemplate === t ? 'px-2 py-1 rounded bg-brand text-white font-bold text-[8pt]' : 'px-2 py-1 rounded bg-neutral-200 hover:bg-neutral-300 text-[8pt]';
          }
        });
      }

      function updatePhoto() {
        const url = document.getElementById('photo-url').value;
        if (url) {
          localStorage.setItem('cv-photo-url', url);
          render();
        }
      }

      function render() {
        const container = document.getElementById('cv-content');

        if (currentTemplate === 'canva') {
          container.innerHTML = renderCanva();
        } else if (currentTemplate === 'modern') {
          container.innerHTML = renderModernSidebar();
        } else if (currentTemplate === 'classic') {
          container.innerHTML = renderClassic();
        } else if (currentTemplate === 'executive') {
          container.innerHTML = renderExecutive();
        } else if (currentTemplate === 'developer') {
          container.innerHTML = renderDeveloper();
        } else if (currentTemplate === 'minimalist') {
          container.innerHTML = renderMinimalist();
        } else if (currentTemplate === 'timeline') {
          container.innerHTML = renderTimeline();
        } else if (currentTemplate === 'editorial') {
          container.innerHTML = renderEditorial();
        } else if (currentTemplate === 'hacker') {
          container.innerHTML = renderHacker();
        } else if (currentTemplate === 'swiss') {
          container.innerHTML = renderSwiss();
        } else if (currentTemplate === 'academic') {
          container.innerHTML = renderAcademic();
        } else if (currentTemplate === 'architect') {
          container.innerHTML = renderArchitect();
        } else if (currentTemplate === 'newspaper') {
          container.innerHTML = renderNewspaper();
        } else if (currentTemplate === 'brutalist') {
          container.innerHTML = renderBrutalist();
        } else if (currentTemplate === 'boutique') {
          container.innerHTML = renderBoutique();
        }
      }
      function getCommonData() {
        const b = data.basics;
        const customPhoto = localStorage.getItem('cv-photo-url');
        const handle = b.url.split('/').filter(Boolean).pop();
        const photoSrc = customPhoto || 'https://github.com/toonvank.png'; // Default to user's github photo
        return { b, photoSrc, handle };
      }

      function renderCanva() {
