<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CV - Anton van Kimmenade</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-bg: #1c3553;
            --primary-text: #1c3553;
            --text-dark: #333333;
            --text-light: #555555;
            --white: #ffffff;
            --border-color: #b0c4de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #eef2f5;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .cv-container {
            width: 210mm; /* A4 width */
            min-height: 297mm; /* A4 height */
            background-color: var(--white);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            overflow: hidden;
        }

        @media print {
            body { padding: 0; background-color: #fff; }
            .cv-container { box-shadow: none; width: 210mm; height: 297mm; }
        }

        /* --- SIDEBAR (Links) --- */
        .sidebar {
            width: 33%;
            background-color: var(--primary-bg);
            color: var(--white);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .profile-img-container {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--white);
        }

        .sidebar h2 {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .contact-list, .skills-list, .lang-list {
            list-style: none;
            font-size: 11px;
            line-height: 1.6;
        }

        .contact-list li {
            display: flex;
            align-items: flex-start;
            margin-bottom: 10px;
            gap: 8px;
        }

        .sidebar-item {
            margin-bottom: 25px;
        }

        .sidebar-item-title {
            font-weight: 600;
            font-size: 11px;
            margin-bottom: 3px;
        }
        
        .sidebar-item-subtitle {
            font-size: 11px;
            font-weight: 300;
            margin-bottom: 2px;
        }

        .sidebar-item ul {
            list-style-type: disc;
            padding-left: 15px;
            font-size: 11px;
            font-weight: 300;
        }

        .skills-list li, .lang-list li {
            position: relative;
            padding-left: 12px;
            margin-bottom: 6px;
            font-weight: 300;
        }

        .skills-list li::before, .lang-list li::before {
            content: "•";
            position: absolute;
            left: 0;
            top: 0;
        }

        /* --- MAIN CONTENT (Rechts) --- */
        .main-content {
            width: 67%;
            padding: 50px 40px;
            color: var(--text-dark);
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-text);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .header h1 span {
            font-weight: 300;
        }

        .header h3 {
            font-size: 16px;
            font-weight: 400;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }

        .divider {
            height: 3px;
            background-color: var(--primary-text);
            width: 100%;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary-text);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-bottom: 15px;
            margin-top: 25px;
        }

        .profile-text {
            font-size: 11px;
            line-height: 1.6;
            color: var(--text-light);
            text-align: justify;
        }

        /* Timeline / Ervaring */
        .timeline {
            border-left: 1.5px solid var(--border-color);
            padding-left: 20px;
            margin-top: 20px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 25px;
        }

        .timeline-item::before {
            content: "";
            position: absolute;
            width: 9px;
            height: 9px;
            background-color: var(--primary-bg);
            border-radius: 50%;
            left: -25px;
            top: 4px;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2px;
        }

        .job-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .job-date {
            font-size: 10px;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .job-company {
            font-size: 11px;
            font-weight: 400;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        .job-description {
            list-style-type: disc;
            padding-left: 15px;
            font-size: 11px;
            line-height: 1.5;
            color: var(--text-light);
        }

        .job-description li {
            margin-bottom: 4px;
        }

        /* Referentie small text */
        .ref-name { font-weight: 600; font-size: 12px; }
        .ref-company { font-weight: 300; font-size: 11px; margin-bottom: 2px;}
        .ref-email { font-weight: 300; font-size: 9px;}
    </style>
</head>
<body>

<script>

                </ul>
            </div>

            <div>
                <h2>REFERENTIE</h2>
                <div class="ref-name">${data.referentie.naam}</div>
                <div class="ref-company">${data.referentie.bedrijf}</div>

            </div>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1><strong>${p.naam.split(' ')[0].toUpperCase()}</strong> <span>${p.naam.split(' ').slice(1).join(' ').toUpperCase()}</span></h1>

            <section>

            <section>

                <div class="timeline">
                    ${data.ervaring.map(exp => `
                        <div class="timeline-item">

    `;
    
    document.getElementById('cv-content').innerHTML = content;
</script>

</body>
</html>
