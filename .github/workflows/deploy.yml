name: Deploy CV

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-cv
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server directory
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/cv-site"
          echo "Deploying to $DEPLOY_DIR"
          
          mkdir -p "$DEPLOY_DIR"
          # Clean destination (mimic rsync --delete)
          find "$DEPLOY_DIR" -mindepth 1 -delete
          
          # Copy all files including hidden ones
          cp -rp . "$DEPLOY_DIR/"
          
          # Remove internal Git/GitHub files from the deployment folder
          rm -rf "$DEPLOY_DIR/.git" "$DEPLOY_DIR/.github"

      - name: Start/Restart web server
        env:
          RUNNER_TRACKING_ID: ""
        run: |
          PORT=8080
          echo "Checking if python3 is available..."
          python3 --version || (echo "python3 not found" && exit 1)

          echo "Starting web server on port $PORT..."
          # Kill any old instance
          pkill -f "python3 -m http.server $PORT" || true
          
          cd "$HOME/cv-site"
          # Start the server using the RUNNER_TRACKING_ID trick to prevent cleanup
          nohup python3 -m http.server $PORT --bind 0.0.0.0 > server.log 2>&1 &
          
          sleep 5
          if ps aux | grep -v grep | grep "python3 -m http.server $PORT" > /dev/null; then
            echo "Server is running in background on port $PORT."
            echo "You should be able to access it at http://$(hostname -I | awk '{print $1}'):$PORT/cv-a4.html"
          else
            echo "ERROR: Server failed to stay alive. Last 10 lines of server.log:"
            tail -n 10 server.log
            exit 1
          fi
