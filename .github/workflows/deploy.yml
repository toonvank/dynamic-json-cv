name: Deploy CV

on:
  push:
    branches: ["main"]

concurrency:
  group: deploy-cv
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to server directory
        run: |
          set -euo pipefail
          DEPLOY_DIR="$HOME/cv-site"
          echo "Deploying to $DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            ./ "$DEPLOY_DIR/"
